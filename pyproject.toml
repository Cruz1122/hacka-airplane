[project]
name = "nevados-bench"
version = "0.1.0"
description = "Stress benchmark of small language models for an offline park assistant (latency, TPS, function calling, grounding)."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.23",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.scripts]
nevados-bench = "nevados_bench.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nevados_bench"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Spanish prompt and corpus text legitimately contains characters ruff flags as ambiguous.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Phase 1 experiments hold long Spanish eval strings and inline configs.
"experiments/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
