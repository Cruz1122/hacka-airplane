# Model registry. `file` may be an exact filename or a glob resolved against the repo listing;
# the fetch command pins the resolved filename, size and sha256 in config/models.lock.yaml.
# deployable=false marks non-commercial licenses kept only as a reference ceiling.
# thinking: none | off_by_default | on_by_default | always (no switch).
defaults:
  quant: Q4_K_M
  deployable: true
  thinking: none
  grounded_qa: true

models:
  - {id: qwen3-0.6b, repo: unsloth/Qwen3-0.6B-GGUF, file: "Qwen3-0.6B-Q4_K_M.gguf", license: apache-2.0, thinking: on_by_default,
     sampling: {temperature: 0.7, top_p: 0.8, top_k: 20}}
  # LoRA fine-tune of Qwen3-0.6B for route/extract (notebooks/finetune_router.ipynb, run r1); no upstream repo.
