<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asistente del parque</title>
<style>
  :root {
    --bg: #f6f5f1; --surface: #ffffff; --text: #1d2321; --muted: #5d6763;
    --line: #dcdcd4; --accent: #2f5d50; --accent-text: #ffffff;
    --user: #e3ece8; --warn-bg: #fff4dc; --warn-text: #5c4300; --error: #9b2c1f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141816; --surface: #1d2321; --text: #e8ece9; --muted: #a3ada8;
      --line: #313a36; --accent: #7fb8a5; --accent-text: #0f1513;
      --user: #24332d; --warn-bg: #3a3014; --warn-text: #f3dd9d; --error: #f09a8c;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .notice {
    margin: 0; padding: 8px 16px; font-size: 13px;
    background: var(--warn-bg); color: var(--warn-text);
  }
  main { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 88%; padding: 10px 12px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .meta { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
  .error { color: var(--error); }
  form {
    display: flex; gap: 8px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line); background: var(--surface);
  }
  textarea {
    flex: 1; resize: none; min-height: 44px; max-height: 120px; padding: 10px 12px;
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px;
  }
  button {
    min-height: 44px; padding: 0 16px; font: inherit; font-weight: 600; cursor: pointer;
    border-radius: 10px; border: 1px solid var(--accent);
  }
  .primary { background: var(--accent); color: var(--accent-text); }
  .secondary { background: transparent; color: var(--accent); font-size: 14px; min-height: 36px; padding: 0 12px; }
  button:disabled { opacity: .55; cursor: wait; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Asistente del parque</h1>
    <p id="station">Funciona sin conexión</p>
  </div>
  <button class="secondary" id="reset" type="button">Nueva conversación</button>
</header>
<p class="notice" role="note">Ante una emergencia, busque de inmediato a un guardaparque. Este asistente solo responde con información oficial cargada en el equipo.</p>
<main id="log" aria-live="polite" aria-label="Conversación"></main>
<form id="form" autocomplete="off">
  <label for="input" class="visually-hidden">Escriba su pregunta</label>
  <textarea id="input" rows="1" maxlength="600" placeholder="Escriba su pregunta…" required></textarea>
  <button class="primary" id="send" type="submit">Enviar</button>
</form>
<script>
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");

  function add(text, who, meta) {
    const div = document.createElement("div");
    div.className = "msg " + who;
    div.textContent = text;
    if (meta) {
      const span = document.createElement("span");
      span.className = "meta";
      span.textContent = meta;
      div.appendChild(span);
    }
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  fetch("/api/info").then(r => r.json()).then(info => {
    if (info.device_station_name) {
      document.getElementById("station").textContent = info.device_station_name + " · sin conexión";
    }
  }).catch(() => {});

  add("Hola. Puedo ayudarle con horarios, senderos, requisitos de ingreso, clima, " +
      "seguridad en altura y registro de visitas. ¿Qué necesita?", "bot");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    add(message, "user");
    input.value = "";
    send.disabled = true;
    const pending = add("Pensando…", "bot");
    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({message}),
      });
      const data = await response.json();
      pending.remove();
      if (!response.ok) {
        add("No pude responder: " + (data.error || response.status), "bot error");
      } else {
        add(data.reply, "bot", (data.latency_ms / 1000).toFixed(1) + " s");
      }
    } catch (error) {
      pending.remove();
      add("No pude conectar con el asistente en este equipo.", "bot error");
    } finally {
      send.disabled = false;
      input.focus();
    }
  });

  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      form.requestSubmit();
    }
  });

  document.getElementById("reset").addEventListener("click", async () => {
    await fetch("/api/reset", {method: "POST"}).catch(() => {});
    log.replaceChildren();
    add("Conversación nueva. ¿Qué necesita?", "bot");
  });
</script>
</body>
</html>
