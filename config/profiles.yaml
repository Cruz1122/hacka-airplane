# Container hardware profiles approximating an 8 GB mid-range phone.
# Host topology: 4 physical cores, SMT siblings 0<->4, 1<->5, 2<->6, 3<->7.
# No SMT siblings, no CFS quota (it distorts TTFT), no swap (memory == memory_swap).
profiles:
  phone-tight:
    cpuset: "0-2"
    threads: 3
    memory: "4g"
  phone-nominal:
    cpuset: "0-3"
    threads: 4
    memory: "5g"
  # The real device (Moto Edge 60 Fusion, MT6878 = Dimensity 7300): cpu4-7 are the 2.5 GHz
  # Cortex-A78 cores, cpu0-3 the A55s. Used only with `--target phone`; pinned by taskset.
  # `memory` is informational there: Android has no per-process limit, the LMK decides.
  phone-device:
    cpuset: "4-7"
    threads: 4
    memory: "8g"

server:
  image: "ghcr.io/ggml-org/llama.cpp:server"  # resolved to a digest in config/image.lock
  ctx_size: 12288
  parallel: 1
  cache_ram_mib: 0  # host-RAM prompt cache off so cold prefill is really cold
  reasoning: "off"
  port: 8080
