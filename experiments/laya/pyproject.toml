[project]
name = "laya-exp"
version = "0.1.0"
description = "Phase 1: Laya System 1 + embedding retrieval experiments (isolated from the main project)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "laya==0.5.1",
  "torch>=2.4",
  "sentence-transformers>=3.0",
  "transformers>=4.48",
  "rank-bm25>=0.2.2",
  "numpy",
  "onnx",
  "onnxruntime",
  "jsonschema",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
